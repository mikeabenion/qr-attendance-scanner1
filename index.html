
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 25px auto;
      padding: 16px;
      color: #172033;
      background: #f3f6fb;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
    }
    input, button {
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      border-radius: 6px;
    }
    input { border: 1px solid #ccd4df; }
    button {
      border: 0;
      background: #173b68;
      color: white;
      cursor: pointer;
    }
    button.stop { background: #9b3030; }
    #reader { width: 100%; margin-top: 15px; }
    #result {
      background: #edf2f8;
      padding: 14px;
      margin-top: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .hint { color: #596779; font-size: 14px; }
  </style>
</head>
<body>
<div class="card">
  <h2>Student QR Attendance</h2>
  <p class="hint">Scan once for time-in and again later for time-out.</p>

  <label for="scanPin">Scanner PIN</label>
  <input id="scanPin" type="password" placeholder="Enter scanner PIN">

  <button onclick="startScanner()">Start Camera</button>
  <button class="stop" onclick="stopScanner()">Stop Camera</button>

  <div id="reader"></div>
  <div id="result">Enter the scanner PIN, then start the camera.</div>
</div>

<script>
const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE";

let scanner = null;
let processing = false;
let lastCode = "";
let lastScanAt = 0;

function show(text) {
  document.getElementById("result").textContent = text;
}

async function startScanner() {
  if (scanner) return;

  if (!/^https:\/\/.+\/exec(?:\?.*)?$/.test(SCRIPT_URL)) {
    show("Set SCRIPT_URL to your deployed Apps Script URL ending in /exec.");
    return;
  }

  if (!document.getElementById("scanPin").value.trim()) {
    show("Enter the scanner PIN first.");
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    show("Camera access requires HTTPS and a supported browser.");
    return;
  }

  scanner = new Html5Qrcode("reader");

  try {
    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || !cameras.length) {
      throw new Error("No camera detected. Check the webcam connection.");
    }

    // Select the first available camera. You can change cameras
    // in the scanner library UI if multiple cameras are available.
    await scanner.start(
      cameras[0].id,
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onScan,
      function () {}
    );

    show("Camera ready. Scan a student QR code.");
  } catch (err) {
    scanner = null;
    show("Camera error: " + (err.message || err));
  }
}

async function stopScanner() {
  if (!scanner) return;

  const current = scanner;
  scanner = null;

  try {
    if (current.isScanning) await current.stop();
    current.clear();
    show("Camera stopped.");
  } catch (err) {
    show("Could not stop camera: " + err.message);
  }
}

function onScan(decodedText) {
  const now = Date.now();

  if (processing) return;
  if (decodedText === lastCode && now - lastScanAt < 5000) return;

  processing = true;
  lastCode = decodedText;
  lastScanAt = now;

  show("Recording attendance for QR value: " + decodedText);

  const callbackName = "attendanceCallback_" +
    now + "_" + Math.floor(Math.random() * 100000);

  const script = document.createElement("script");
  let finished = false;

  const timeout = setTimeout(() => {
    finish();
    show("Request timed out. Check Apps Script deployment and connection.");
  }, 20000);

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(timeout);
    delete window[callbackName];
    script.remove();
    processing = false;
  }

  window[callbackName] = function(data) {
    finish();

    if (data.success) {
      const r = data.result || {};
      show(
        "SUCCESS\n" +
        "Action: " + (r.action || "") + "\n" +
        "Student: " + (r.studentName || "") + "\n" +
        "Student ID: " + (r.studentId || "") + "\n" +
        "Time: " + (r.time || "") + "\n" +
        (r.message || "")
      );
    } else {
      show("ATTENDANCE ERROR\n" + (data.message || "Unknown error"));
    }
  };

  script.onerror = function() {
    finish();
    show("Cannot reach Apps Script. Check the /exec URL and deployment access.");
  };

  const url = new URL(SCRIPT_URL);
  url.searchParams.set("action", "scan");
  url.searchParams.set("qrValue", decodedText);
  url.searchParams.set(
    "scanPin",
    document.getElementById("scanPin").value
  );
  url.searchParams.set("callback", callbackName);

  script.src = url.toString();
  document.body.appendChild(script);
}
</script>
</body>
</html>
